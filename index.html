<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脑洞大侦探 </title>
    <style>
        :root {
            --purple: #e040fb;
            --green: #69f0ae;
            --red: #ff5252;
            --yellow: #ffd740;
            --neon1: #ff00ff;
            --neon2: #00ffff;
            --neon3: #ffaa00;
            --bg: #050510;
            --card-bg: rgba(18, 8, 35, 0.9);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
            transition: box-shadow 0.3s;
        }
        body.fire-border { box-shadow: inset 0 0 60px #ff6600, inset 0 0 120px #ff0000; }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--d) infinite, floatStar 6s infinite alternate; opacity: 0;
        }
        @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
        @keyframes floatStar { 0% { transform: translateY(0px); } 100% { transform: translateY(-20px); } }
        .container { position: relative; z-index: 1; width: 100%; max-width: 500px; }
        .hint-wrap {
            position: fixed; top: 15px; right: 15px; z-index: 100;
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
        }
        .hint-btn {
            background: linear-gradient(135deg, #e040fb, #ff00ff); color: white;
            border: none; padding: 10px 18px; border-radius: 30px;
            font-weight: bold; font-size: 14px; cursor: pointer;
            box-shadow: 0 0 15px #e040fb; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .coin-display {
            background: linear-gradient(135deg, #ffd740, #ffaa00); color: black;
            border: none; padding: 10px 18px; border-radius: 30px;
            font-weight: bold; font-size: 14px; box-shadow: 0 0 20px #ffd740;
            display: flex; align-items: center; gap: 5px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .hint-btn:active { transform: scale(0.9); }
        .hint-btn:disabled { background: #555; box-shadow: none; }
        .modal-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999; display: none;
            justify-content: center; align-items: center;
        }
        .modal-box {
            background: linear-gradient(145deg, #1e1e3f, #0e0e2a); color: white;
            padding: 25px; border-radius: 25px; max-width: 360px; text-align: center;
            box-shadow: 0 0 40px var(--purple); animation: popIn 0.3s;
            border: 1px solid var(--purple);
        }
        @keyframes popIn { from { transform: scale(0.7); } to { transform: scale(1); } }
        .btn {
            display: block; width: 100%; padding: 16px; border: none; border-radius: 50px;
            font-size: 18px; font-weight: bold; margin: 10px 0; cursor: pointer;
            transition: 0.2s; letter-spacing: 1px; color: white;
            position: relative; overflow: hidden;
        }
        .btn:active { transform: scale(0.93); }
        .btn-start { background: linear-gradient(90deg, #ff00ff, #ff5252); box-shadow: 0 0 25px #ff5252; border: 1px solid rgba(255,255,255,0.3); }
        .btn-true { background: var(--green); color: black; box-shadow: 0 0 15px var(--green); }
        .btn-false { background: var(--red); box-shadow: 0 0 15px var(--red); }
        .btn-other { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        .game-card {
            background: var(--card-bg); border-radius: 25px; padding: 20px;
            box-shadow: 0 0 35px rgba(224,64,251,0.4); margin: 15px 0;
            color: white; border: 1px solid rgba(224,64,251,0.5);
            backdrop-filter: blur(10px); transition: all 0.3s;
        }
        .status-bar { display: flex; justify-content: space-between; color: #aaa; margin: 10px 0; flex-wrap: wrap; }
        .progress-bar { height: 8px; background: #333; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #e040fb, #ff00ff);
            width: 0; transition: 0.5s; box-shadow: 0 0 10px #e040fb;
        }
        .timer { font-size: 24px; }
        .timer.urgent { color: var(--red); animation: shake 0.3s infinite; text-shadow: 0 0 15px red; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .q-icon { font-size: 50px; text-align: center; margin: 15px 0; filter: drop-shadow(0 0 10px var(--neon2)); }
        .question { font-size: 18px; color: #ddd; text-align: center; line-height: 1.6; }
        .feed-title { font-size: 24px; text-align: center; }
        .explain-box {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;
            margin: 15px 0; border-left: 3px solid var(--neon2);
        }
        .particle {
            position: fixed; z-index: 998; pointer-events: none;
            animation: particleFly 1.5s ease-out forwards;
        }
        @keyframes particleFly {
            0% { opacity:1; transform: translate(0,0) scale(1); }
            100% { opacity:0; transform: translate(var(--x), var(--y)) scale(0); }
        }
        .toast {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,60,0.95); color: white; padding: 10px 20px;
            border-radius: 30px; font-weight: bold; z-index: 1001;
            animation: toastIn 0.5s ease-out; pointer-events: none;
            border: 1px solid var(--purple); box-shadow: 0 0 20px var(--purple);
        }
        @keyframes toastIn { 0% { opacity:0; transform: translateX(-50%) scale(0.5); } 100% { opacity:1; transform: translateX(-50%) scale(1); } }
        .shop-item {
            display: inline-flex; align-items: center; background: rgba(255,255,255,0.08);
            padding: 8px 14px; border-radius: 20px; margin: 5px; cursor: pointer;
            font-size: 14px; transition: 0.2s; border: 1px solid rgba(255,255,255,0.15);
        }
        .shop-item:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
        .shop-item.disabled { opacity: 0.4; cursor: not-allowed; }
        .crazy-badge {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: red; color: white; padding: 5px 20px; border-radius: 20px;
            font-weight: bold; z-index: 1000; animation: pulse 0.5s infinite;
            border: 1px solid white;
        }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 10px red; } 50% { box-shadow: 0 0 30px red; } }
        .diff-selector, .cat-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 15px 0; }
        .diff-btn, .cat-chip {
            padding: 8px 16px; border-radius: 25px; font-weight: bold; cursor: pointer;
            transition: 0.2s; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); color: white;
        }
        .diff-btn.active {
            background: linear-gradient(135deg, var(--purple), #ff00ff);
            box-shadow: 0 0 15px var(--purple); border-color: white;
        }
        .cat-chip.selected { background: var(--neon2); color: black; border-color: white; box-shadow: 0 0 15px var(--neon2); }
        .title-glow { text-shadow: 0 0 20px var(--purple), 0 0 40px var(--neon1); }
    </style>
</head>
<body>
<div class="stars" id="starsContainer"></div>
<div class="hint-wrap">
    <div class="coin-display" id="coinDisplay">🪙 <span id="totalCoins">0</span></div>
    <button class="hint-btn" id="hintBtn" onclick="useHint()">💡 提示 (<span id="hintCount">2</span>)</button>
</div>
<div class="container">
    <div class="modal-mask" id="modalMask">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <!-- 首页 -->
    <div id="cover" class="game-card" style="text-align:center">
      <span id="busuanzi_container_site_uv" style="color:#aaa;">
    👥 总访客数：<span id="busuanzi_value_site_uv"></span> 人
</span>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
        <div style="font-size:70px;">💀</div>
        <h1 class="title-glow" id="gameTitle" style="color:var(--purple);cursor:pointer;" onclick="clickTitle()">脑洞大侦探</h1>
        <p style="color:#aaa;">500题高迷惑题库 · 难度自选 · 类别自定</p>
        <div class="diff-selector">
            <span class="diff-btn active" id="diffEasy" onclick="setDifficulty('easy')">🐣 十分簡單 (7s)</span>
            <span class="diff-btn" id="diffNormal" onclick="setDifficulty('normal')">⚡ 簡單 (5s)</span>
            <span class="diff-btn" id="diffHell" onclick="setDifficulty('hell')">💀 非常簡單 (3s)</span>
        </div>
        <div class="cat-selector" id="catSelector"></div>
        <button class="btn btn-start" onclick="startIntro()">🚀 开始整活</button>
        <button class="btn btn-other" onclick="showRank()">🏆 排行榜</button>
        <button class="btn btn-other" onclick="shareGame()">📤 喊人来受虐</button>
        <p style="color:#555;font-size:12px;margin-top:10px;">🤫 快速点标题5次开启疯狂模式</p>
    </div>

    <!-- 游戏界面 -->
    <div id="gameBox" class="hidden">
        <div id="qCard" class="game-card">
            <div class="status-bar">
                <span>📖 <span id="pageNum">1/20</span></span>
                <span>💰 <span id="nowScore">0</span></span>
                <span class="timer" id="timerDisplay">10s</span>
            </div>
            <div class="progress-bar"><div id="progressBar" class="progress-fill"></div></div>
            <div class="q-icon" id="iconBox">💀</div>
            <div class="question" id="questionText"></div>
            <button class="btn btn-true" onclick="selectAns(true)">✅ 真的</button>
            <button class="btn btn-false" onclick="selectAns(false)">❌ 假的</button>
            <button class="btn btn-other" onclick="selectAns('dontKnow')">🤷 我不会</button>
            <div style="display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px;">
                <span class="shop-item" onclick="buyTime()">⏳ +5秒 🪙4</span>
                <span class="shop-item" onclick="buyHint()">💡 付费提示 🪙4</span>
                <span class="shop-item" id="doubleItem" onclick="buyDouble()">🔥 双倍积分 🪙6</span>
                <span class="shop-item" onclick="buyInsurance()">🛡️ 保险卡 🪙5</span>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-other" onclick="restartGame()">🔄 重来</button>
                <button class="btn btn-other" onclick="backToCover()">🚪 退出</button>
            </div>
        </div>
        <div id="feedCard" class="game-card hidden">
            <div class="feed-title" id="feedTitle"></div>
            <div class="explain-box" id="tipsBox"></div>
            <button class="btn btn-other" onclick="nextQuestion()">➡️ 下一题</button>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-other" onclick="restartGame()">🔄 重来</button>
                <button class="btn btn-other" onclick="backToCover()">🚪 退出</button>
            </div>
        </div>
    </div>

    <!-- 结果页 -->
    <div id="resultBox" class="game-card hidden" style="text-align:center">
        <div style="font-size:60px;" id="resultEmoji">👑</div>
        <h2 style="color:var(--purple);">整活结束！</h2>
        <div style="font-size:40px;font-weight:bold;color:var(--yellow);" id="finalScore">0</div>
        <div style="font-size:20px;color:#ccc;" id="rankTitle"></div>
        <div style="background:rgba(255,255,255,0.05);padding:15px;border-radius:15px;margin:15px 0;color:#ccc;" id="iqReport"></div>
        <p style="color:var(--yellow);">🪙 本局获得金币：<span id="earnedCoins">0</span> | 总金币：<span id="finalTotalCoins">0</span></p>
        <input id="playerName" placeholder="输入你的沙雕昵称" style="width:80%;padding:12px;border-radius:20px;border:2px solid var(--purple);background:transparent;color:white;text-align:center;margin:10px 0;outline:none;">
        <button class="btn btn-start" onclick="saveScore()">📝 提交分数</button>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-other" onclick="restartGame()">🔄 再整一次</button>
            <button class="btn btn-other" onclick="openWrongBook()">📖 打脸记录</button>
        </div>
        <button class="btn btn-other" onclick="backToCover()">🚪 回首页</button>
    </div>

    <!-- 排行榜 -->
    <div id="rankBox" class="game-card hidden">
        <h3 style="text-align:center;color:var(--purple);">🏆 全球排行榜（分享导入可合并）</h3>
        <table style="width:100%;color:white;" id="rankTable">
            <tr><th>名次</th><th>玩家</th><th>分数</th></tr>
        </table>
        <button class="btn btn-other" onclick="showRank()" style="margin-top:15px;">🔄 刷新排行榜</button>
        </div>
        <button class="btn btn-other" onclick="backToCover()">🔙 返回</button>
    </div>

    <!-- 错题本 -->
    <div id="wrongBox" class="game-card hidden">
        <h3 style="color:var(--red);text-align:center;">👊 大型打脸现场</h3>
        <div id="wrongList" style="color:white;"></div>
        <button class="btn btn-other" onclick="backToResult()">🔙 返回成绩</button>
    </div>
</div>

<script>
    // ==================== 500道高迷惑性题库 ====================
const allQuestions = [
    // ===== 健康医疗（约80题） =====
    { q: "流鼻血时仰头止血是错误的方法。", ans: true, icon: "👃", tip: "仰头会导致血液倒流进气管或食道，正确做法是低头按压鼻翼。" },
    { q: "运动后立刻大量喝水会加重心脏负担。", ans: true, icon: "💧", tip: "刚运动完心脏仍高速运转，大量水分快速进入血容量骤增，应小口慢饮。" },
    { q: "饭后立即刷牙反而可能损伤牙齿。", ans: true, icon: "🪥", tip: "食物中的酸性物质会暂时软化牙釉质，立即刷牙会加速磨损。" },
    { q: "蚊子叮咬后用肥皂水清洗可以缓解瘙痒。", ans: true, icon: "🦟", tip: "肥皂水呈碱性，能中和蚊子唾液的酸性，减轻痒感。" },
    { q: "长期不吃早饭会增加患胆结石的风险。", ans: true, icon: "🍳", tip: "不吃早餐会使胆汁在胆囊内长时间滞留、浓缩，容易形成结石。" },
    { q: "医院打针前的皮试是为了测试是否过敏。", ans: true, icon: "💉", tip: "皮试就是过敏反应试验，将微量药液注入皮内观察反应。" },
    { q: "水银体温计打破后洒落的水银应迅速用硫磺粉覆盖。", ans: true, icon: "🌡️", tip: "硫磺与水银反应生成硫化汞，可降低汞蒸气的挥发，同时需通风。" },
    { q: "穿黄色衣服更容易招引蚜虫。", ans: true, icon: "👕", tip: "蚜虫具有趋黄性，黄色衣物或物品确实更吸引它们。" },
    { q: "眼睛进了灰尘后频繁揉眼可能划伤角膜。", ans: true, icon: "👁️", tip: "揉眼会让异物在眼球表面摩擦，可能造成角膜上皮损伤。" },
    { q: "飞机起飞降落时嚼口香糖可以缓解耳朵不适。", ans: true, icon: "✈️", tip: "咀嚼和吞咽动作能促使咽鼓管打开，平衡中耳内外气压。" },
    { q: "304不锈钢保温杯内壁属于食品级安全材质。", ans: true, icon: "☕", tip: "304不锈钢耐腐蚀性较好，符合国家食品接触材料标准。" },
    { q: "废旧电池不能与生活垃圾混在一起丢弃。", ans: true, icon: "🔋", tip: "电池含重金属，需单独回收处理，随意丢弃会污染环境。" },
    { q: "眼睛盯着太阳看哪怕几秒也可能造成视网膜损伤。", ans: true, icon: "☀️", tip: "太阳的强光会聚焦在视网膜上，短时间注视即可造成热损伤。" },
    { q: "高铁车厢内禁止吸烟是因为烟雾会触发警报。", ans: true, icon: "🚄", tip: "高铁采用全封闭车厢，烟雾传感器极为灵敏，吸烟会触发报警导致降速或停车。" },
    { q: "被狗追时站着不动比转身逃跑更安全。", ans: true, icon: "🐕", tip: "逃跑会激发狗的追逐本能，站着不动、避免眼神接触反而可能降低攻击欲望。" },
    { q: "塑料瓶底部的数字代表该塑料的安全类别。", ans: true, icon: "🧴", tip: "底部的三角形数字是塑料分类标志，1-7分别代表PET、HDPE等材质。" },
    { q: "紧张时手心出汗是交感神经兴奋所致。", ans: true, icon: "✋", tip: "紧张时交感神经兴奋，导致汗腺分泌增加，尤其是手掌、脚底等部位。" },
    { q: "风筝线绷紧时非常锋利，可能割伤行人。", ans: true, icon: "🪁", tip: "风筝线在紧绷状态下受力极大且极细，对快速经过的物体如同利刃。" },
    { q: "香蕉表皮出现黑点说明糖分增加口感更甜。", ans: true, icon: "🍌", tip: "香蕉成熟过程中淀粉转化为糖，表皮出现黑点是完全成熟的表现。" },
    { q: "空腹吃柿子确实可能导致胃结石。", ans: true, icon: "🍅", tip: "柿子含大量鞣酸，空腹状态下与胃酸结合易形成鞣酸蛋白凝胶，进而形成胃柿石。" },
    { q: "发芽的生姜可以食用，但发芽的土豆却有毒。", ans: true, icon: "🧅", tip: "生姜发芽不会产生龙葵碱，安全可食；土豆发芽则会产生龙葵碱，有毒不能吃。" },
    { q: "长时间戴口罩不会造成缺氧。", ans: true, icon: "😷", tip: "合格口罩的透气性满足日常呼吸需求，氧气和二氧化碳可自由通过，不会缺氧。" },
    { q: "急速冷冻的蔬菜，营养保留率可能高于常温存放的新鲜蔬菜。", ans: true, icon: "🧊", tip: "急速冷冻在极短时间内锁住营养，而新鲜蔬菜在常温下会持续流失维生素。" },
    { q: "打哈欠会传染，与大脑中的镜像神经元有关。", ans: true, icon: "🥱", tip: "镜像神经元让我们看到别人打哈欠时会自动模拟，这是共情能力的体现。" },
    { q: "长时间看绿色植物缓解眼疲劳，主要原因是远眺让睫状肌放松，而非颜色本身。", ans: true, icon: "🌿", tip: "看远处物体时睫状肌舒张，晶状体变薄，眼睛得以休息，绿色并无特殊护眼功效。" },
    { q: "牙膏尾部的色标条与成分无关，仅是生产定位标记。", ans: true, icon: "🦷", tip: "彩色条是光电定位标志，用于机器封口切管，不代表化学成分或天然提取物比例。" },
    { q: "先倒茶再加牛奶会让奶茶口感更顺滑。", ans: true, icon: "🫖", tip: "先倒茶后加牛奶，牛奶受热较慢，蛋白质变性程度不同，口感更顺滑。" },
    { q: "身份证完全暴露在阳光下暴晒，可能导致内置芯片损坏。", ans: true, icon: "🪪", tip: "身份证内嵌芯片耐温有限，长时间暴晒会使芯片电路老化或变形，导致读取失败。" },

    let audioCtx = null;
    function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } }
    function beep(freq, duration, type) {
        if (!audioCtx) return;
        try {
            let o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type || 'sine'; o.frequency.value = freq;
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    function spawnParticles(emoji, count = 15) {

            p.style.setProperty('--y', (Math.random() - 0.5) * 200 + 'px');
            p.style.fontSize = (20 + Math.random() * 30) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1500);
        }
    }

    // 金币系统（每局重置）
    let totalCoins = 0;

    let insuranceActive = false;

    function updateCoinDisplay() {
        document.getElementById('totalCoins').innerText = totalCoins;

    function addCoins(amount) {
        let gained = Math.floor(amount * coinMultiplier);
        if (gained < 0) gained = 0;

        earnedCoins += gained;

    }
    function spendCoins(amount) {
        if (totalCoins < amount) return false;

        updateCoinDisplay();
        return true;
    }

    function buyHint() { if (!spendCoins(4)) { showToast('🪙 金币不足！'); return; } let q = questionPool[nowIndex]; showModal('💡 付费提示', q.ans ? '真相：这题是真的！' : '真相：这题是假的！', [{ text: '知道了', cb: () => {} }]); }

    function useHint() { if (hintRemain <= 0) { showToast('免费提示已用完，可用金币购买 💡'); return; } hintRemain--; document.getElementById('hintCount').innerText = hintRemain; if (hintRemain <= 0) document.getElementById('hintBtn').disabled = true; let q = questionPool[nowIndex]; showModal('💡 免费提示', q.ans ? '真相：这题是真的！' : '真相：这题是假的！', [{ text: '知道了', cb: () => {} }]); }

    function toggleCategory(cat) {
        if (selectedCategories.has(cat)) selectedCategories.delete(cat);
        else selectedCategories.add(cat);

    function renderCategoryChips() {
         const container = document.getElementById('catSelector');
    const allCats = [...new Set(allQuestions.map(q => q.category))].sort();
    // 让大类按固定顺序显示
    const order = ["🏥 健康生活", "📱 科技自然", "📚 人文社会", "🏠 生活百科", "🎲 其他"];
    const sortedCats = order.filter(cat => allCats.includes(cat));
    let html = '';
    sortedCats.forEach(cat => {
        const selected = selectedCategories.has(cat) ? 'selected' : '';
        html += `<span class="cat-chip ${selected}" onclick="toggleCategory('${cat}')">${cat}</span>`;
    });
    container.innerHTML = html;
    }

    function initCategories() {
        const allCats = [...new Set(allQuestions.map(q => q.category))];
        selectedCategories = new Set(allCats);
        renderCategoryChips();
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function getQuestions() {
        let filtered = allQuestions.filter(q => selectedCategories.has(q.category));
        if (filtered.length < totalNum) {
            let others = allQuestions.filter(q => !selectedCategories.has(q.category));
            let need = totalNum - filtered.length;
            let supplement = shuffle(others).slice(0, need);
            filtered = [...filtered, ...supplement];
        }
        filtered = shuffle(filtered);
        let t = filtered.filter(q => q.ans);
        let f = filtered.filter(q => !q.ans);
        let pool = [];
        for (let i = 0; i < Math.min(t.length, f.length, totalNum/2); i++) {
            pool.push(t[i], f[i]);
        }
        let remaining = filtered.filter(q => !pool.includes(q));
        while (pool.length < totalNum && remaining.length > 0) {
            pool.push(remaining.shift());
        }
        return shuffle(pool).slice(0, totalNum);
    }

    function hideAll() { if (countTimer) { clearInterval(countTimer); countTimer = null; } document.querySelectorAll('.game-card').forEach(el => el.classList.add('hidden')); document.getElementById('modalMask').style.display = 'none'; }


    function clickTitle() { titleClickCount++; if (titleClickCount >= 5 && !isCrazyMode) { isCrazyMode = true;

        hintRemain = 0; coinMultiplier += 1;
        document.getElementById('hintCount').innerText = '0';

    function startIntro() {
        initAudio();
        hideAll();
        document.getElementById('gameBox').classList.remove('hidden');
        document.getElementById('qCard').classList.add('hidden');
        document.getElementById('feedCard').classList.add('hidden');
        let count = 3;
        let introDiv = document.createElement('div');
        introDiv.style.fontSize = '80px';
        introDiv.style.textAlign = 'center';

        document.getElementById('gameBox').appendChild(introDiv);

        function tick() {
            if (count > 0) {

                setTimeout(tick, 800);
            } else {
                introDiv.remove();
                startGame();
            }
        }
        tick();
    }

    function startGame() {
        totalCoins = 0;
        earnedCoins = 0;
        updateCoinDisplay();

        let baseTime = { easy: 7, normal: 5, hell: 3 };
        MAX_TIME = isCrazyMode ? { easy: 4, normal: 3, hell: 2 }[currentDifficulty] : baseTime[currentDifficulty];
        coinMultiplier = { easy: 0, normal: 1, hell: 2 }[currentDifficulty];
        if (isCrazyMode) coinMultiplier += 1;
        doubleActive = false;
        insuranceActive = false;
        document.getElementById('doubleItem').classList.remove('disabled');
        questionPool = getQuestions(); nowIndex = 0; userScore = 0; wrongList = []; combo = 0; maxCombo = 0;
        hintRemain = isCrazyMode ? 0 : 2;
        document.getElementById('hintCount').innerText = hintRemain;
        document.getElementById('hintBtn').disabled = hintRemain === 0;
        document.getElementById('qCard').classList.remove('hidden');
        document.getElementById('feedCard').classList.add('hidden');
        document.getElementById('gameBox').classList.remove('hidden');
        document.body.classList.remove('fire-border');
        loadQuestion();
    }

    function loadQuestion() { if (countTimer) { clearInterval(countTimer); countTimer = null; } let q = questionPool[nowIndex]; document.getElementById('pageNum').innerText = `${nowIndex + 1}/${totalNum}`; document.getElementById('nowScore').innerText = userScore; document.getElementById('progressBar').style.width = `${(nowIndex + 1) / totalNum * 100}%`; document.getElementById('iconBox').innerText = q.icon; document.getElementById('questionText').innerText = q.q; timeLeft = MAX_TIME; let timerEl = document.getElementById('timerDisplay'); timerEl.innerText = timeLeft + 's'; timerEl.classList.remove('urgent'); countTimer = setInterval(() => { timeLeft--; timerEl.innerText = timeLeft + 's'; if (timeLeft <= 3) timerEl.classList.add('urgent'); if (timeLeft <= 0) { clearInterval(countTimer); spawnParticles('💥', 10); beep(100, 0.6, 'sawtooth'); combo = 0; document.body.classList.remove('fire-border'); showToast(randomTaunt(timeUpTaunts)); wrongList.push({ q: q.q, userAns: '超时', rightAns: q.ans, tip: q.tip }); showFeed(false); } }, 1000); }

    function selectAns(ans) { clearInterval(countTimer); if (ans === 'dontKnow') { showModal('🤷 别放弃', '请选择你认为的答案', [{ text: '回去答题', cb: () => { loadQuestion(); } }]); return; } let q = questionPool[nowIndex]; let isRight = (ans === q.ans); if (isRight) { let points = scorePerQ; if (doubleActive) { points *= 2; doubleActive = false; document.getElementById('doubleItem').classList.remove('disabled'); } userScore += points; combo++; if (combo > maxCombo) maxCombo = combo; beep(600, 0.2, 'sine'); if (combo >= 3) { spawnParticles('🔥', 20); userScore += combo; document.body.classList.add('fire-border'); } spawnParticles('🎉', 20); showToast(randomTaunt(correctTaunts)); addCoins(1); } else { if (insuranceActive) { insuranceActive = false; showToast('🛡️ 保险卡生效！答错不记仇'); } else { combo = 0; document.body.classList.remove('fire-border'); beep(150, 0.6, 'square'); spawnParticles('💩', 15); showToast(randomTaunt(wrongTaunts)); wrongList.push({ q: q.q, userAns: ans, rightAns: q.ans, tip: q.tip }); } } showFeed(isRight); }

    function showFeed(isRight) { document.getElementById('qCard').classList.add('hidden'); document.getElementById('feedCard').classList.remove('hidden'); document.getElementById('feedTitle').innerText = isRight ? '✅ 答对了！' : '❌ 答错了！'; document.getElementById('feedTitle').style.color = isRight ? '#69f0ae' : '#ff5252'; document.getElementById('tipsBox').innerHTML = `<strong>💡 科普：</strong>${questionPool[nowIndex].tip}`; }

    function nextQuestion() { nowIndex++; if (nowIndex >= totalNum) return showResult(); document.getElementById('feedCard').classList.add('hidden'); document.getElementById('qCard').classList.remove('hidden'); loadQuestion(); }

    function showResult() { hideAll(); document.getElementById('resultBox').classList.remove('hidden'); document.getElementById('finalScore').innerText = userScore; document.getElementById('earnedCoins').innerText = earnedCoins; document.getElementById('finalTotalCoins').innerText = totalCoins; let emoji, title, iq; if (userScore >= 90) { emoji = '👑'; title = '知识之神'; iq = '智商碾压99.9%的人类。'; } else if (userScore >= 70) { emoji = '💀'; title = '脑洞王者'; iq = '知识储备还行，偶尔翻车。'; } else if (userScore >= 50) { emoji = '😈'; title = '地狱街溜子'; iq = '半蒙半猜，运气成分大于实力。'; } else { emoji = '🤡'; title = '知识难民'; iq = '你的大脑处于休眠状态。'; } document.getElementById('resultEmoji').innerText = emoji; document.getElementById('rankTitle').innerText = title + ' (最高连击' + maxCombo + '次)'; document.getElementById('iqReport').innerText = iq; }

 function showRank() {

                tbody.innerHTML += '<tr><td colspan="3">暂无数据，快去成为第一名！</td></tr>';

            for (let i = 0; i < Math.min(scores.length, 20); i++) {

function saveScore() {
    let name = document.getElementById('playerName').value.trim();
    if (!name) { alert("请输入昵称！"); return; }
    fetch('https://cors-anywhere.herokuapp.com/https://jsonblob.com/api/jsonBlob/019ebff5-d5ee-76de-8ee4-409465a903c8')
        .then(res => res.json())
        .then(data => {
            let scores = data || [];
            let existing = scores.find(s => s.name === name);
            if (existing) {
                if (userScore > existing.score) existing.score = userScore;
            } else {
                scores.push({ name: name, score: userScore, time: Date.now() });
            }
            scores.sort((a,b) => b.score - a.score);
            if (scores.length > 50) scores = scores.slice(0, 50);
            return fetch('https://cors-anywhere.herokuapp.com/https://jsonblob.com/api/jsonBlob/019ebff5-d5ee-76de-8ee4-409465a903c8', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(scores)
            });
        })
        .then(() => {
            alert(`✅ 分数 ${userScore} 已提交到全球排行榜！`);
        })
        .catch(() => {
            alert('❌ 提交失败，请检查网络');
        });
}
